		7ECF00010000000000000001 /* Select GoogleService-Info for configuration */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/PromptFlow/GoogleService-Info.plist",
				"$(SRCROOT)/PromptFlow/GoogleService-Info-Staging.plist",
			);
			name = "Select GoogleService-Info for configuration";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# Single owner of GoogleService-Info.plist in the built product. Neither plist\n# is a target member, so this phase is the only thing that can place one in the\n# bundle. If it does not run, the app ships with NO Firebase config and fails\n# loudly at launch -- deliberately preferred over silently shipping production\n# config into a test build.\ncase \"${CONFIGURATION}\" in\n  Staging|Debug)\n    # Debug maps to staging as well: it must not be structurally\n    # capable of writing into the production Firebase project (and\n    # the Google Ads account linked to it), rather than relying on\n    # the #if !DEV guard around FirebaseApp.configure() to keep it\n    # dormant.\n    SRC_NAME=\"GoogleService-Info-Staging.plist\"\n    ;;\n  Release)\n    SRC_NAME=\"GoogleService-Info.plist\"\n    ;;\n  *)\n    echo \"error: no GoogleService-Info mapping for configuration '${CONFIGURATION}'. Add one to this script before building.\" >&2\n    exit 1\n    ;;\nesac\n\nSRC=\"${SRCROOT}/PromptFlow/${SRC_NAME}\"\nDEST_DIR=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDEST=\"${DEST_DIR}/GoogleService-Info.plist\"\n\nif [ ! -f \"${SRC}\" ]; then\n  echo \"error: ${SRC_NAME} is missing at ${SRC}. Configuration '${CONFIGURATION}' cannot be built. Refusing to fall back to a different Firebase project.\" >&2\n  exit 1\nfi\n\nmkdir -p \"${DEST_DIR}\"\ncp -f \"${SRC}\" \"${DEST}\"\necho \"note: GoogleService-Info.plist <- ${SRC_NAME} (configuration ${CONFIGURATION})\"\n";
		};
