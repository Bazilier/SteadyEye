			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# Crashlytics dSYM upload.\n#\n# Release only. Only Release reaches users, so only Release needs symbols in\n# Firebase. Skipping the rest also avoids the synchronous\n# `upload-symbols --validate` step failing builds against the staging Firebase\n# project (steadyeye-staging2), and keeps debug cycles fast.\n#\n# Runs last, after \"Select GoogleService-Info for configuration\": the Crashlytics\n# run script reads GoogleService-Info.plist out of the built product to decide\n# which Firebase app to upload to, so it must see the copy that phase placed.\nif [ \"${CONFIGURATION}\" != \"Release\" ]; then\n  echo \"note: Crashlytics dSYM upload SKIPPED for configuration '${CONFIGURATION}' (Release only).\"\n  exit 0\nfi\n\nRUN_SCRIPT=\"${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\"\n\nif [ ! -f \"${RUN_SCRIPT}\" ]; then\n  echo \"error: Crashlytics run script not found at ${RUN_SCRIPT}. Resolve Swift packages and rebuild.\" >&2\n  exit 1\nfi\n\necho \"note: Crashlytics dSYM upload running for configuration '${CONFIGURATION}'.\"\n\"${RUN_SCRIPT}\"\n";
		};
